<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>MyHub</title>
<link rel="stylesheet" href="/shell.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    user-select: none;
  }
  html, body { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; }

  /* 바탕화면 */
  #desktop {
    position: fixed; inset: 0; top: calc(48px + env(safe-area-inset-top));
    background: url('/wallpaper.webp') center/cover no-repeat, #f0f2f5;
    overflow: hidden;
  }

  /* 상단바: 맥 스타일 글래스 (공통 레이아웃은 shell.css) */
  .g-nav {
    background: #ffffff;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  /* 투명 위젯 */
  .widget {
    position: absolute;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.85), 0 10px 40px rgba(0,0,0,0.10);
    border-radius: 0; padding: 20px;
    cursor: move;
    min-width: 300px;
    transform: translateZ(0);
  }
  #w-storage { top: 80px; right: 24px; }
  #w-system { top: 320px; right: 24px; }
  .widget h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #5c5c5c; }
  .widget .bar-row { margin-bottom: 10px; }
  .widget .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .widget .bar-label span:first-child { font-weight: 600; }
  .widget .bar-label span:last-child { color: #9a9a9a; }
  .widget .bar-track { height: 8px; background: #f4f4f4; border-radius: 0; overflow: hidden; }
  .widget .bar-fill { height: 100%; border-radius: 0; transition: width 0.5s; }
  .widget .sys-row { font-size: 13px; line-height: 2; color: #5c5c5c; }
  .widget .sys-row b { font-weight: 700; color: #141414; }

  #w-storage { top: 24px; right: 24px; }
  #w-system { top: 220px; right: 24px; }
  #w-briefing { top: 416px; right: 24px; }
  .widget .brief-date { font-size: 12px; color: #9a9a9a; margin-bottom: 10px; }
  .widget .brief-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; padding: 8px 0; cursor: pointer;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    color: #141414; text-decoration: none;
  }
  .widget .brief-row:last-child { border-bottom: none; }
  .widget .brief-row:hover { opacity: 0.7; }
  .widget .brief-row .b-ic { color: #5c5c5c; display: inline-flex; }
  .widget .brief-row .b-ic svg { width: 15px; height: 15px; }
  .widget .brief-row .b-label { font-weight: 600; }
  .widget .brief-row .b-count { margin-left: auto; font-weight: 700; color: #141414; }
  .widget .brief-row .b-sub { font-size: 12px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

  /* 바탕화면 아이콘 */
  #icons {
    position: absolute; top: 24px; left: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .d-icon {
    width: 76px; text-align: center; cursor: pointer;
    padding: 8px 4px; border-radius: 8px;
    transition: background 0.15s;
  }
  .d-icon:hover { background: #e8e8e8; }
  .d-icon.dragging { opacity: 0.5; }
  .d-icon .ic {
    width: 52px; height: 52px; margin: 0 auto 6px;
    background: #ffffff; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e2e2e2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    color: #141414;
  }
  .d-icon .ic svg { width: 26px; height: 26px; }
  .d-icon .nm {
    font-size: 13px; color: #333; font-weight: 700;
    margin-top: 6px; letter-spacing: -0.3px;
  }

  @media (max-width: 640px) {
    #w-storage, #w-system {
      display: none;
      position: fixed;
      left: 12px; right: 12px; min-width: 0;
    }
    #w-storage.show { display: block; top: 60px; }
    #w-system.show { display: block; }
    #widget-toggle { display: inline-flex !important; }
  }
  #widget-toggle { display: none; }
</style>
</head>
<body>
<header class="g-nav"><a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a><div class="spacer"></div><button id="widget-toggle" style="background:none;border:none;color:#1a1a1a;cursor:pointer;padding:8px;display:none;align-items:center;" aria-label="위젯 보기"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></button><span class="ver" id="clock"></span></header>
<div id="desktop">
  <div id="icons"></div>

  <div class="widget" id="w-storage">
    <h3>저장소</h3>
    <div id="storage-bars"><div style="font-size:13px;color:#9a9a9a;">로딩 중...</div></div>
  </div>

  <div class="widget" id="w-system">
    <h3>시스템</h3>
    <div id="sysinfo"><div style="font-size:13px;color:#9a9a9a;">로딩 중...</div></div>
  </div>

  <div class="widget" id="w-briefing">
    <h3>오늘 브리핑</h3>
    <div class="brief-date" id="brief-date"></div>
    <div id="briefing-body"><div style="font-size:13px;color:#9a9a9a;">로딩 중...</div></div>
  </div>

<script src="/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Lucide 아이콘 (https://lucide.dev)
const icons = {
  memo: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>`,
  ai: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>`,
  schedule: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>`,
  todo: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>`,
  studio: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>`
};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  if (b < 1024*1024*1024) return (b/1024/1024).toFixed(1) + ' MB';
  return (b/1024/1024/1024).toFixed(2) + ' GB';
}

async function loadSystem() {
  try {
    const res = await fetch('/api/system');
    const s = await res.json();
    if (!s.ok && s.error) {
      $('storage-bars').innerHTML = `<div style="font-size:12px;color:#fcc;">오류: ${s.error}</div>`;
      return;
    }
    const d1 = s.d1;
    let clUsed, clLimit;
    if (s.cloudinary && s.cloudinary_source === 'cloudinary-api') {
      clUsed = s.cloudinary.used_bytes;
      clLimit = s.cloudinary.limit_bytes;
    } else {
      clUsed = s.files.bytes;
      clLimit = null;
    }
    const pct1 = Math.min(100, (d1.size_bytes / d1.limit_bytes * 100));
    const pct2 = clLimit ? Math.min(100, (clUsed / clLimit * 100)) : 0;
    $('storage-bars').innerHTML = `
      <div class="bar-row">
        <div class="bar-label"><span>D1 데이터베이스</span><span>${fmtBytes(d1.size_bytes)} / ${fmtBytes(d1.limit_bytes)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct1}%;background:rgb(105,145,245);"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>첨부파일 (Cloudinary)</span><span>${fmtBytes(clUsed)}${clLimit ? ' / ' + fmtBytes(clLimit) : ''}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct2}%;background:rgb(165,192,255);"></div></div>
      </div>
    `;
    $('sysinfo').innerHTML = `
      <div class="sys-row"><b>Workers</b> · ${s.worker.name}</div>
      <div class="sys-row"><b>D1</b> · myhub-db</div>
      <div class="sys-row"><b>KV</b> · myhub-kv</div>
      <div class="sys-row"><b>런타임</b> · ${s.worker.runtime}</div>
    `;
  } catch (e) {
    $('storage-bars').innerHTML = `<div style="font-size:12px;color:#fcc;">로드 실패</div>`;
  }
}

async function loadModules() {
  const mods = await fetch('/api/modules').then(r => r.json());
  const iconsEl = $('icons');
  iconsEl.innerHTML = '';

  mods.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'd-icon';
    d.draggable = true;
    d.innerHTML = `<div class="ic">${icons[m.id] || ''}</div><div class="nm">${esc(m.name)}</div>`;
    d.onclick = () => location.href = m.path;
    d.ondragstart = (e) => { e.dataTransfer.setData('text/plain', i); d.classList.add('dragging'); };
    d.ondragend = () => d.classList.remove('dragging');
    iconsEl.appendChild(d);
  });

  // 추적 페이지 (OTEL 스팬 뷰어 — 모듈이 아니라 AI 모듈의 부속 페이지라 직접 추가)
  const traceIcon = document.createElement('div');
  traceIcon.className = 'd-icon';
  traceIcon.innerHTML = `<div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg></div><div class="nm">추적</div>`;
  traceIcon.onclick = () => location.href = '/trace.html';
  iconsEl.appendChild(traceIcon);

  try {
    const pos = JSON.parse(localStorage.getItem('iconPos') || '{}');
    [...iconsEl.children].forEach((el, i) => {
      if (pos[i]) {
        // 기존 위치도 그리드에 스냅
        const x = Math.max(0, Math.round(pos[i].x / GRID_X) * GRID_X);
        const y = Math.max(0, Math.round(pos[i].y / GRID_Y) * GRID_Y);
        el.style.position = 'absolute'; el.style.left = x + 'px'; el.style.top = y + 'px';
      }
    });
  } catch (e) { console.warn('아이콘 위치 복원 실패:', e); }
}

$('desktop').ondragover = (e) => e.preventDefault();
function saveIconPos() {
  const pos = {};
  [...$('icons').children].forEach((c, idx) => {
    if (c.style.position === 'absolute') pos[idx] = { x: parseInt(c.style.left), y: parseInt(c.style.top) };
  });
  localStorage.setItem('iconPos', JSON.stringify(pos));
}
const GRID_X = 96, GRID_Y = 108;
function dropIcon(el, clientX, clientY) {
  const iconsRect = $('icons').getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = clientX - iconsRect.left - w / 2;
  let y = clientY - iconsRect.top - h / 2;
  // 그리드에 스냅 (윈도우/맥처럼)
  x = Math.max(0, Math.round(x / GRID_X) * GRID_X);
  y = Math.max(0, Math.round(y / GRID_Y) * GRID_Y);
  el.style.position = 'absolute';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  saveIconPos();
}
$('desktop').ondrop = (e) => {
  e.preventDefault();
  const i = e.dataTransfer.getData('text/plain');
  const el = $('icons').children[i];
  if (el) dropIcon(el, e.clientX, e.clientY);
};
// 터치 드래그 (모바일)
let tDrag = null;
document.addEventListener('touchstart', (e) => {
  const icon = e.target.closest('.d-icon');
  if (!icon) return;
  const t = e.touches[0];
  tDrag = { el: icon, x0: t.clientX, y0: t.clientY, moved: false };
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!tDrag) return;
  const t = e.touches[0];
  if (Math.abs(t.clientX - tDrag.x0) + Math.abs(t.clientY - tDrag.y0) > 12) {
    tDrag.moved = true;
    tDrag.el.classList.add('dragging');
    e.preventDefault();
  }
}, { passive: false });
document.addEventListener('touchend', (e) => {
  if (!tDrag) return;
  const { el, moved } = tDrag;
  tDrag = null;
  el.classList.remove('dragging');
  if (moved) {
    const t = e.changedTouches[0];
    dropIcon(el, t.clientX, t.clientY);
  }
});

// 위젯 드래그
document.querySelectorAll('.widget').forEach(w => {
  let sx, sy, ox, oy, dragging = false;
  w.addEventListener('mousedown', (e) => {
    if (e.target.closest('a, button')) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    ox = w.offsetLeft; oy = w.offsetTop;
    w.style.zIndex = 100;
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    w.style.left = (ox + e.clientX - sx) + 'px';
    w.style.top = (oy + e.clientY - sy) + 'px';
    w.style.right = 'auto';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; w.style.zIndex = '';
    // 위치 저장
    const pos = {};
    document.querySelectorAll('.widget').forEach(ww => {
      if (ww.style.left) pos[ww.id] = { x: parseInt(ww.style.left), y: parseInt(ww.style.top) };
    });
    localStorage.setItem('widgetPos', JSON.stringify(pos));
  });
});

// 위젯 위치 복원 (모바일에서는 기본 위치 사용)
try {
  if (window.innerWidth > 768) {
    const wpos = JSON.parse(localStorage.getItem('widgetPos') || '{}');
    Object.entries(wpos).forEach(([id, p]) => {
      const el = document.getElementById(id);
      if (el && p) { el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; el.style.right = 'auto'; }
    });
  }
} catch (e) { console.warn('위젯 위치 로드 실패:', e); }

// 모바일 위젯 토글
document.getElementById('widget-toggle').addEventListener('click', () => {
  const ws = document.getElementById('w-storage');
  const wy = document.getElementById('w-system');
  const showing = !ws.classList.contains('show');
  ws.classList.toggle('show', showing);
  wy.classList.toggle('show', showing);
  if (showing) {
    // 시스템 위젯을 저장소 위젯 바로 아래에 배치
    requestAnimationFrame(() => {
      const r = ws.getBoundingClientRect();
      wy.style.top = (r.bottom + 12) + 'px';
    });
  }
});

async function loadBriefing() {
  try {
    const res = await fetch('/api/briefing/today');
    if (res.status === 401) return; // 로그인 전이면 조용히 스킵
    const b = await res.json();
    if (!b.ok) return;
    // 날짜 표시: "10월 9일 금요일"
    const d = new Date(b.date + 'T12:00:00');
    const week = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    $('brief-date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${week}요일`;
    const firstSched = (b.schedules || [])[0];
    const firstTodo = (b.todos || [])[0];
    const schedSub = firstSched ? esc(firstSched.title) : '';
    const todoSub = firstTodo ? esc(firstTodo.title) : '';
    $('briefing-body').innerHTML = `
      <a class="brief-row" href="/schedule.html">
        <span class="b-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span>
        <span class="b-label">일정</span>
        ${schedSub ? `<span class="b-sub">${schedSub}${b.counts.schedules > 1 ? ` 외 ${b.counts.schedules - 1}개` : ''}</span>` : ''}
        <span class="b-count">${b.counts.schedules}개</span>
      </a>
      <a class="brief-row" href="/search.html">
        <span class="b-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <span class="b-label">통합 검색</span>
        <span class="b-sub">메모·대화·일정·할 일</span>
      </a>
      <a class="brief-row" href="/todo.html">
        <span class="b-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></span>
        <span class="b-label">할일</span>
        ${todoSub ? `<span class="b-sub">${todoSub}${b.counts.todos > 1 ? ` 외 ${b.counts.todos - 1}개` : ''}</span>` : ''}
        <span class="b-count">${b.counts.todos}개</span>
      </a>
    `;
  } catch (e) {
    console.warn('위젯 렌더링 실패:', e);
  }
}

loadModules();
loadSystem();
loadBriefing();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
