<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>Finder</title>
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/css/finder.css">
<link rel="stylesheet" href="/css/picker.css">
<script src="/vendor/lucide/lucide.min.js"></script>
<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/vendor/mammoth.browser.min.js"></script>
</head>
<body>
<header class="g-nav">
  <a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a>
  <div class="spacer"></div>
  <div class="nav-search-wrap"><span class="s-ic"><i data-lucide="search"></i></span><input id="finderSearch" type="search" placeholder="파일 검색" autocomplete="off"></div>
  <button class="nav-icon-btn" id="finderNewFolderBtn" aria-label="새 폴더"><i data-lucide="folder-plus"></i></button>
  <button class="nav-icon-btn" id="finderUploadBtn" aria-label="업로드"><i data-lucide="upload"></i></button>
</header>
<div class="g-main">
  <div class="finder-layout">
    <aside class="finder-side">
      <button type="button" class="finder-side-item" data-view="recent"><i data-lucide="clock"></i><span>최근 항목</span></button>
      <div class="finder-side-title">즐겨찾기</div>
      <div id="sideFavorites"></div>
      <div class="finder-side-title">위치</div>
      <button type="button" class="finder-side-item" id="sideRoot"><i data-lucide="archive"></i><span>보관함</span><span class="finder-side-badge" id="sideRootBadge" hidden></span></button>
      <button type="button" class="finder-side-item" data-view="trash"><i data-lucide="trash-2"></i><span>휴지통</span></button>
      <div class="finder-side-usage" id="sideUsage"></div>
    </aside>
    <main class="finder-main" id="finderMain">
      <div class="finder-toolbar">
        <button type="button" class="finder-nav-btn" id="finderBack" aria-label="뒤로"><i data-lucide="chevron-left"></i></button>
        <button type="button" class="finder-nav-btn" id="finderFwd" aria-label="앞으로"><i data-lucide="chevron-right"></i></button>
        <nav class="finder-path" id="finderPath" aria-label="경로"></nav>
        <div class="finder-view-toggle" role="group" aria-label="보기 방식">
          <button type="button" id="finderViewList" class="is-active" aria-label="목록 보기"><i data-lucide="list"></i></button>
          <button type="button" id="finderViewGrid" aria-label="격자 보기"><i data-lucide="layout-grid"></i></button>
        </div>
        <button type="button" class="finder-nav-btn" id="finderSortBtn" aria-label="정렬"><i data-lucide="arrow-up-down"></i></button>
        <div class="spacer"></div>
        <button type="button" class="finder-empty-trash" id="finderEmptyTrash" style="display:none;">휴지통 비우기</button>
        <button type="button" class="finder-nav-btn" id="finderNewBtn" aria-label="새 폴더"><i data-lucide="folder-plus"></i></button>
        <button type="button" class="finder-nav-btn" id="finderUpBtn" aria-label="올리기"><i data-lucide="upload"></i></button>
        <span class="finder-toolbar-search" id="finderToolbarSearchWrap" hidden><input id="finderToolbarSearch" type="search" placeholder="검색" autocomplete="off"></span>
        <button type="button" class="finder-nav-btn" id="finderSearchBtn" aria-label="검색"><i data-lucide="search"></i></button>
      </div>
      <div class="finder-list" id="finderList"></div>
      <footer class="finder-statusbar"><span id="finderStatusPath"></span><span id="finderStatus"></span></footer>
    </main>
  </div>
</div>

<div id="finderViewer" role="dialog" aria-modal="true">
  <div class="fv-window">
    <div id="fvChrome">
      <span id="fvName"></span>
      <div class="spacer"></div>
      <button type="button" id="fvSave">저장</button>
      <button type="button" id="fvClose" aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    <div id="fvBody"></div>
  </div>
</div>

<div id="officePicker" class="office-picker-backdrop" hidden>
  <div class="office-picker" role="dialog" aria-modal="true" aria-labelledby="officePickerTitle">
    <div class="office-picker-head">
      <strong id="officePickerTitle">파일 열기</strong>
      <button type="button" id="officePickerClose" aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    <nav class="office-picker-crumb" id="officeCrumb" aria-label="폴더 경로"></nav>
    <div class="office-picker-list" id="officePickList"></div>
    <div class="office-picker-save" id="officeSaveRow" hidden>
      <label for="officeSaveName">이름</label>
      <input type="text" id="officeSaveName" autocomplete="off">
    </div>
    <p class="office-picker-status" id="officePickerStatus"></p>
    <div class="office-picker-foot">
      <button type="button" id="officePickImport" class="office-ghost-btn office-pick-import" hidden>이 기계에서 가져오기</button>
      <button type="button" id="officePickCancel" class="office-ghost-btn">취소</button>
      <button type="button" id="officePickConfirm" class="office-primary-btn">열기</button>
    </div>
  </div>
</div>

<input type="file" id="finderFileInput" multiple hidden>

<script src="/nav.js"></script>
<script src="/js/file-icons.js"></script>
<script src="/js/asset-url.js"></script>
<script src="/js/finder-codec.js"></script>
<script src="/js/finder-viewer.js"></script>
<script src="/js/finder-format-text.js"></script>
<script src="/js/finder-format-hwp.js"></script>
<script src="/js/finder-format-sheet.js"></script>
<script src="/js/finder-format-slide.js"></script>
<script src="/js/finder-format-doc.js"></script>
<script src="/js/finder-format-pdf.js"></script>
<script src="/js/assistant-bridge.js"></script>
<script src="/js/finder.js"></script>
</body>
</html>
