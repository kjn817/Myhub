<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>통합 검색</title>
<link rel="stylesheet" href="/shell.css">
<script src="/vendor/lucide/lucide.min.js"></script>
<link rel="stylesheet" href="/css/search.css">
</head>
<body>
<header class="g-nav"><a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a><div class="spacer"></div></header>
<div class="wrap">
  <h1>통합 검색</h1>
  <div class="search-box">
    <input id="q" type="search" placeholder="메모·대화·일정·할 일 검색" autocomplete="off">
    <button id="searchBtn">검색</button>
  </div>
  <div class="filters" id="filters">
    <button data-type="all" class="active">전체</button>
    <button data-type="memo">메모</button>
    <button data-type="chat">대화</button>
    <button data-type="schedule">일정</button>
    <button data-type="todo">할 일</button>
  </div>
  <div id="results"></div>
</div>
<script src="/nav.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
