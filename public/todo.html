<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>할일</title>
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/assistant-widget.css">
<script src="/vendor/lucide/lucide.min.js"></script>
<link rel="stylesheet" href="/css/todo.css">
</head>
<body>
<header class="g-nav">
  <a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a>
  <div class="spacer"></div>
  <button class="icon-btn" id="addBtn" aria-label="상세 추가"><i data-lucide="plus"></i></button>
  <span class="ver" id="clock"></span>
</header>

<div class="g-main">
<div class="wrap">
  <div class="quick-add">
    <input id="quickInput" type="text" placeholder="할일을 입력하고 Enter" maxlength="200" autocomplete="off">
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-status="pending">진행중<span class="n" id="cntPending"></span></button>
    <button class="tab" data-status="done">완료<span class="n" id="cntDone"></span></button>
    <button class="tab" data-status="all">전체</button>
    <span class="spacer"></span>
    <div class="search">
      <i data-lucide="search"></i>
      <input id="searchInput" type="search" placeholder="검색" autocomplete="off" aria-label="할일 검색">
    </div>
  </div>

  <div id="todoList"></div>
</div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle">할일 추가</h3>
    <div class="fld"><label>제목</label><input id="fTitle" type="text" maxlength="200" placeholder="무엇을 해야 하나요?"></div>
    <div class="fld"><label>설명</label><textarea id="fDesc" placeholder="상세 내용 (선택)"></textarea></div>
    <div class="fld-row">
      <div class="fld"><label>마감일</label><input id="fDue" type="datetime-local"></div>
      <div class="fld"><label>우선순위</label>
        <select id="fPri">
          <option value="2">높음</option>
          <option value="1" selected>보통</option>
          <option value="0">낮음</option>
        </select>
      </div>
    </div>
    <div class="modal-acts">
      <button class="m-btn ghost" id="cancelBtn">취소</button>
      <button class="m-btn solid" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script src="/assistant-widget.js"></script>
<!-- 비서 브리지: TODO_CSP(script-src 'self')라 인라인 init이 차단되므로,
     원본(canonical)의 인라인 init 값(scheduler/캘리)을 bridge data-*로 게시한다.
     단독 실행이면 위젯 init, 창 모드이면 셸에 assistant-declare를 보낸다. -->
<script src="/js/assistant-bridge.js" data-persona-id="scheduler" data-persona-name="캘리" data-avatar="/avatars/cali-128.webp"></script>
<script src="/js/common/text-utils.js"></script>
<script src="/js/todo.js"></script>
</body>
</html>
