<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Excel (기본 시트)</title>
<link rel="stylesheet" href="/vendor/fortune/fortune.css">
<style>
  html, body { height: 100%; margin: 0; }
  #fortuneSheet { position: absolute; inset: 0; }
  #fortuneFail { display: none; padding: 48px 20px; text-align: center; color: #52525b; font-family: sans-serif; font-size: 14px; }
</style>
<script src="/vendor/lucide/lucide.min.js"></script>
<script src="/vendor/fortune/fortune.js"></script>
</head>
<body>
<div id="fortuneSheet"></div>
<div id="fortuneFail"><p>기본 시트 엔진을 불러오지 못했어요.</p></div>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/js/office-fetch.js"></script>
<script>
(function () {
  'use strict';
  // FortuneSheet 폴백 호스트: GridCraft를 못 쓸 때의 최후 경로.
  var params = new URLSearchParams(location.search);
  var fileId = params.get('file');
  var Fortune = window.FortuneSheet || window.fortuneSheet || window.Fortune;
  if (!Fortune || !Fortune.createWorkbook) {
    document.getElementById('fortuneFail').style.display = '';
    return;
  }

  function toSheets(workbookData) {
    var sheets = [];
    try {
      var wb = window.XLSX.read(workbookData, { type: 'array' });
      wb.SheetNames.forEach(function (name) {
        var rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1 });
        var celldata = [];
        rows.forEach(function (row, r) {
          (row || []).forEach(function (v, c) {
            if (v !== null && v !== undefined && v !== '') {
              celldata.push({ r: r, c: c, v: { v: v, m: String(v) } });
            }
          });
        });
        sheets.push({ name: name, celldata: celldata });
      });
    } catch (e) { console.debug('시트 변환 실패:', e); }
    return sheets.length ? sheets : [{ name: 'Sheet1', celldata: [] }];
  }

  function boot(data) {
    Fortune.createWorkbook(document.getElementById('fortuneSheet'), {
      data: data || [{ name: 'Sheet1', celldata: [] }],
      lang: 'ko',
    });
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'myhub:engine-ready', app: 'excel' }, location.origin);
    }
  }

  if (fileId && window.MyHubOfficeFetch && window.XLSX) {
    window.MyHubOfficeFetch.loadFile(fileId)
      .then(function (out) { return out.blob.arrayBuffer(); })
      .then(function (buf) { boot(toSheets(buf)); })
      .catch(function () { boot(null); });
  } else {
    boot(null);
  }
})();
</script>
</body>
</html>
