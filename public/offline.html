<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오프라인 — MyHub</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f5f4; color: #1c1917; font-family: -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; max-width: 320px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #57534e; line-height: 1.6; margin: 0 0 20px; }
  button { font-size: 15px; padding: 10px 20px; border: none; border-radius: 8px;
    background: #bfdbfe; color: #1e3a5f; cursor: pointer; }
  button:active { background: #93c5fd; }
</style>
</head>
<body>
<main>
  <h1>오프라인 상태입니다</h1>
  <p>인터넷에 연결되어 있지 않아요.<br>연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
