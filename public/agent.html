/* ===== 부트: 전체 데이터를 한 번에 로드 (근본적 성능 개선) ===== */
async function boot() {
  // 1. 프로젝트 목록 로드
  await loadProjects();
  // 2. 각 프로젝트의 채팅+버전+미리보기를 병렬로 프리로드
  const preloadTasks = Store.projects.map(async (p) => {
    const pid = p.id;
    const skey = 'p' + pid;
    try {
      // 채팅, 버전, 미리보기를 병렬로
      const [chatR, verR] = await Promise.all([
        api('/chats?session_key=' + encodeURIComponent(skey)).catch(() => ({ ok: false })),
        api('/' + pid + '/versions').catch(() => ({ ok: false })),
      ]);
      if (chatR.ok && chatR.data) {
        Store.setChat(skey, chatR.data);
      }
      if (verR.ok && verR.data) {
        const list = verR.data.versions || [];
        Store.setVersions(pid, list, verR.data.draft_version_id, verR.data.published_version_id);
        // 미리보기 HTML 프리로드 (최신 버전)
        const draft = list.find(x => x.id === verR.data.draft_version_id) || list[0];
        if (draft) {
          const vd = await api('/' + pid + '/versions/' + draft.version_no).catch(() => ({ ok: false }));
          if (vd.ok && vd.data.html_content) {
            Store.setPreview(pid, vd.data.html_content);
          }
        }
      }
    } catch (e) { console.warn('미리보기 프리로드 실패:', e); }
  });
  // 백그라운드에서 프리로드 (UI 블로킹 없음)
  Promise.all(preloadTasks).then(() => {
    Store.loaded = true;
  }).catch(e => console.warn("Background sync failed:", e));
  // 3. 활성 작업 확인
  const hasActive = await checkActiveJobs();
  if (!hasActive) {
    restoreChat('new');
  }
}

(async () => {
  await boot();
})();


/* ===== 인페이지 확인 모달 (네이티브 confirm/alert 대체) =====
 * 네이티브 모달은 자동화 브라우저·일부 임베드 환경에서 사용자 상호작용 없이
 * 자동 해제(confirm=false)돼, 삭제·게시 같은 확정 동작이 조용히 취소된다.
 * schedule.html이 커스텀 확인 모달로 바꾼 것과 같은 이유 — 확정 게이트와
 * 결과 안내는 전부 이 모달을 거친다. */
function myhubModal(message, opts) {
  opts = opts || {};
  var okLabel = opts.okLabel || '확인';
  return new Promise(function (resolve) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:10000;display:flex;align-items:center;justify-content:center;';
    var box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:12px;padding:20px;max-width:360px;width:calc(100vw - 48px);box-shadow:0 12px 32px rgba(0,0,0,0.2);';
    var text = document.createElement('p');
    text.style.cssText = 'margin:0 0 16px;font-size:14px;line-height:1.5;color:#24292f;white-space:pre-line;';
    text.textContent = message;
    var btns = document.createElement('div');
    btns.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;';
    function cleanup(v) { overlay.remove(); document.removeEventListener('keydown', onKey); resolve(v); }
    function onKey(e) { if (e.key === 'Escape') cleanup(false); }
    if (opts.cancel !== false) {
      var no = document.createElement('button');
      no.textContent = '취소';
      no.style.cssText = 'padding:6px 14px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;font-size:13px;cursor:pointer;';
      no.onclick = function () { cleanup(false); };
      btns.appendChild(no);
    }
    var yes = document.createElement('button');
    yes.textContent = okLabel;
    yes.style.cssText = 'padding:6px 14px;border:1px solid transparent;border-radius:6px;font-size:13px;cursor:pointer;color:#fff;background:' + (opts.danger ? '#cf222e' : '#1f883d') + ';';
    yes.onclick = function () { cleanup(true); };
    btns.appendChild(yes);
    box.appendChild(text);
    box.appendChild(btns);
    overlay.appendChild(box);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) cleanup(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    yes.focus();
  });
}
function myhubConfirm(message, opts) { return myhubModal(message, opts); }
async function myhubNotice(message) { await myhubModal(message, { cancel: false }); }

/* ===== 프로젝트 우클릭 메뉴 ===== */
function showProjectMenu(e, projectId) {
  e.preventDefault();
  e.stopPropagation();
  const project = projects.find(p => p.id === projectId);
  const projectTitle = project ? project.title : '프로젝트';
  // 기존 메뉴 제거
  document.getElementById('projectMenu')?.remove();
  const menu = document.createElement('div');
  menu.id = 'projectMenu';
  menu.style.cssText = 'position:fixed;z-index:9999;background:#fff;border:1px solid #e1e4e8;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:4px;min-width:160px;';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.innerHTML = `
    <div style="padding:8px 12px;font-size:12px;color:#666;border-bottom:1px solid #eee;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;">${esc(projectTitle)}</div>
    <button onclick="publishProject(${projectId})" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:none;font-size:13px;color:#1a7f37;cursor:pointer;border-radius:4px;" onmouseover="this.style.background='#e6f4ea'" onmouseout="this.style.background='none'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
      게시하기
    </button>
    <button onclick="deleteProject(${projectId})" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;background:none;font-size:13px;color:#cf222e;cursor:pointer;border-radius:4px;" onmouseover="this.style.background='#fff1f1'" onmouseout="this.style.background='none'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      삭제
    </button>
  `;
  document.body.appendChild(menu);
  // 다른 곳 클릭하면 메뉴 닫기
  const close = (ev) => {
    if (!menu.contains(ev.target)) {
      menu.remove();
      document.removeEventListener('click', close);
    }
  };
  setTimeout(() => document.addEventListener('click', close), 0);
}

async function deleteProject(projectId) {
  document.getElementById('projectMenu')?.remove();
  if (!(await myhubConfirm('이 프로젝트를 삭제할까요?\n모든 파일, 버전, 대화 기록이 삭제됩니다.', { okLabel: '삭제', danger: true }))) return;
  try {
    const r = await api('/' + projectId, { method: 'DELETE' });
    if (r.ok) {
      if (curId === projectId) {
        curId = null;
        curHtml = '';
        restoreChat('new');
        toggleDiff(false);
      }
      await loadProjects();
    } else {
      await myhubNotice('삭제 실패: ' + (r.error || ''));
    }
  } catch (e) {
    await myhubNotice('삭제 실패: ' + e.message);
  }
}

async function publishProject(projectId) {
  document.getElementById('projectMenu')?.remove();
  if (!(await myhubConfirm('이 프로젝트를 게시할까요?\n게시된 앱은 홈 화면에서 볼 수 있습니다.', { okLabel: '게시하기' }))) return;
  try {
    const r = await api('/' + projectId + '/publish', { method: 'POST' });
    if (r.ok) {
      await myhubNotice('게시되었습니다.');
      await loadProjects();
    } else {
      await myhubNotice('게시 실패: ' + (r.error || ''));
    }
  } catch (e) {
    await myhubNotice('게시 실패: ' + e.message);
  }
}

/* ===== DiffViewer (Codex 스타일) ===== */
function openDiffViewer(filePath, fromNo, toNo) {
  const modal = document.createElement('div');
  modal.id = 'diffModal';
  modal.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this)closeDiffViewer()">
      <div style="background:#fff;border-radius:12px;width:90vw;max-width:900px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:12px 16px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:8px;">
          <span style="font-weight:600;font-size:14px;">${esc(filePath)}</span>
          <span style="font-size:12px;color:#888;">v${fromNo} → v${toNo}</span>
          <div style="flex:1;"></div>
          <button class="btn btn-sm" onclick="closeDiffViewer()">닫기</button>
        </div>
        <div id="diffContent" style="flex:1;overflow:auto;padding:12px;font-family:monospace;font-size:12px;line-height:1.5;">
          <span style="color:#888;">로딩 중...</span>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  loadDiffContent(filePath, fromNo, toNo);
}
function closeDiffViewer() {
  document.getElementById('diffModal')?.remove();
}
async function loadDiffContent(filePath, fromNo, toNo) {
  const el = document.getElementById('diffContent');
  try {
    // A5: 백엔드 unified diff API 사용 (단일 소스)
    const d = await api('/' + curId + '/versions/' + fromNo + '/diff/' + toNo);
    const ch = d.ok && d.data.changes.find(c => c.path === filePath);
    if (!ch) { el.innerHTML = '<span style="color:#888;">변경 없음</span>'; return; }
    if (ch.type === 'added') { el.innerHTML = '<span style="color:#1a7f37;">새 파일 (전체 추가)</span>'; return; }
    if (ch.type === 'deleted') { el.innerHTML = '<span style="color:#cf222e;">삭제된 파일</span>'; return; }
    el.innerHTML = renderUnifiedDiff(ch.diff || '');
  } catch (e) {
    el.innerHTML = '<span style="color:#cf222e;">로딩 실패</span>';
  }
}
// A5: unified diff 텍스트를 색상 구분 HTML로 렌더링
function renderUnifiedDiff(diffText) {
  if (!diffText) return '<span style="color:#888;">변경 없음</span>';
  let html = '';
  for (const line of diffText.split('\n')) {
    let style = 'color:#666;';
    if (line.startsWith('+') && !line.startsWith('+++')) style = 'background:#dafbe1;color:#1a7f37;';
    else if (line.startsWith('-') && !line.startsWith('---')) style = 'background:#ffebe9;color:#cf222e;';
    else if (line.startsWith('@@')) style = 'color:#4a90d9;';
    else if (line.startsWith('---') || line.startsWith('+++')) style = 'color:#888;font-weight:600;';
    html += `<div style="${style}white-space:pre-wrap;word-break:break-all;padding:1px 8px;">${esc(line)}</div>`;
  }
  return html;
}
// 간단한 라인 diff (LCS 기반이 아닌 휴리스틱)
function simpleLineDiff(oldStr, newStr) {
  const oldLines = oldStr.split('\n');
  const newLines = newStr.split('\n');
  const oldSet = new Set(oldLines);
  const newSet = new Set(newLines);
  let html = '';
  let oldNo = 0, newNo = 0;
  // 변경된 라인만 표시 (간단 버전)
  const maxLines = Math.max(oldLines.length, newLines.length);
  for (let i = 0; i < maxLines; i++) {
    const o = oldLines[i];
    const n = newLines[i];
    if (o === n) {
      oldNo++; newNo++;
      if (i < 3 || i > maxLines - 4) {
        html += `<div style="display:flex;"><span style="width:40px;color:#888;text-align:right;padding-right:8px;">${oldNo}</span><span style="width:40px;color:#888;text-align:right;padding-right:8px;">${newNo}</span><span style="color:#666;">${esc(o || '')}</span></div>`;
      } else if (i === 3) {
        html += `<div style="color:#888;padding:4px;">···</div>`;
      }
    } else {
      if (o !== undefined && !newSet.has(o)) {
        oldNo++;
        html += `<div style="display:flex;background:#ffebe9;"><span style="width:40px;color:#888;text-align:right;padding-right:8px;">${oldNo}</span><span style="width:40px;"></span><span style="color:#cf222e;">- ${esc(o)}</span></div>`;
      }
      if (n !== undefined && !oldSet.has(n)) {
        newNo++;
        html += `<div style="display:flex;background:#dafbe1;"><span style="width:40px;"></span><span style="width:40px;color:#888;text-align:right;padding-right:8px;">${newNo}</span><span style="color:#1a7f37;">+ ${esc(n)}</span></div>`;
      }
    }
  }
  return html;
}
