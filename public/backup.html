<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>백업 - MyHub</title>
<link rel="stylesheet" href="/shell.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
.wrap { max-width: 600px; margin: 0 auto; padding: 20px; }
.card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
.card h2 { margin: 0 0 16px 0; font-size: 18px; }
.desc { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.field input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
.field input:focus { outline: none; border-color: #007aff; }
.btn { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn.secondary { background: #f0f0f0; color: #333; margin-top: 8px; }
.loading { display: none; text-align: center; padding: 20px; color: #666; }
.loading.show { display: block; }
.error { display: none; background: #fee; border: 1px solid #fcc; color: #c00; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
.error.show { display: block; }
.success { display: none; background: #efe; border: 1px solid #cfc; color: #0a0; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
.success.show { display: block; }
.info { background: #f8f8f8; border-radius: 8px; padding: 16px; font-size: 13px; color: #666; line-height: 1.6; }
.info ul { margin: 8px 0; padding-left: 20px; }
</style>
</head>
<body>
<header class="g-nav"><a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a><div class="spacer"></div></header>
<div class="wrap">
  <h1>데이터 백업</h1>
  
  <div class="card">
    <h2>암호화 백업 생성</h2>
    <div class="desc">
      모든 데이터를 AES-256-GCM으로 암호화하여 백업합니다.<br>
      백업 암호를 잊어버리면 복원할 수 없으니 안전하게 보관하세요.
    </div>
    
    <div class="error" id="errorBox"></div>
    <div class="success" id="successBox"></div>
    
    <div class="field">
      <label for="password">백업 암호 (최소 8자)</label>
      <input type="password" id="password" placeholder="백업 암호 입력" autocomplete="new-password">
    </div>
    
    <div class="field">
      <label for="passwordConfirm">백업 암호 확인</label>
      <input type="password" id="passwordConfirm" placeholder="백업 암호 다시 입력" autocomplete="new-password">
    </div>
    
    <button class="btn" id="backupBtn" onclick="createBackup()">백업 생성</button>
    
    <div class="loading" id="loading">
      <p>백업을 생성하고 있습니다...</p>
    </div>
  </div>
  
  <div class="card">
    <div class="info">
      <strong>백업 대상</strong>
      <ul>
        <li>메모, 일정, 할 일</li>
        <li>AI 대화 및 기억</li>
        <li>사용자 설정</li>
      </ul>
      <strong>보안</strong>
      <ul>
        <li>AES-256-GCM 암호화</li>
        <li>PBKDF2 키 파생</li>
        <li>백업 암호는 서버에 저장되지 않음</li>
      </ul>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
async function createBackup() {
  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const loading = document.getElementById('loading');
  const backupBtn = document.getElementById('backupBtn');
  
  // 초기화
  errorBox.classList.remove('show');
  successBox.classList.remove('show');
  
  // 입력 검증
  if (!password) {
    showError('백업 암호를 입력하세요.');
    return;
  }
  if (password.length < 8) {
    showError('백업 암호는 최소 8자 이상이어야 합니다.');
    return;
  }
  if (password !== passwordConfirm) {
    showError('백업 암호가 일치하지 않습니다.');
    return;
  }
  
  // 로딩 상태
  backupBtn.disabled = true;
  loading.classList.add('show');
  
  try {
    const response = await fetch('/api/backup/encrypted', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    });
    
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || '백업 실패');
    }
    
    const backup = await response.json();
    
    // 파일 다운로드
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `myhub-backup-${date}.myhub-backup`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    // 입력 필드 초기화 (보안)
    document.getElementById('password').value = '';
    document.getElementById('passwordConfirm').value = '';
    
    showSuccess('백업이 완료되었습니다. 파일을 안전하게 보관하세요.');
  } catch (e) {
    // 네트워크 오류는 한국어로 변환
    let msg = e.message || '백업 중 오류가 발생했습니다.';
    if (e instanceof TypeError || msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
      msg = '네트워크 오류가 발생했습니다. 연결 상태를 확인하고 다시 시도하세요.';
    }
    showError(msg);
  } finally {
    backupBtn.disabled = false;
    loading.classList.remove('show');
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('show');
}

function showSuccess(msg) {
  const box = document.getElementById('successBox');
  box.textContent = msg;
  box.classList.add('show');
}

// Lucide 아이콘 초기화
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
