<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>일정</title>
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/assistant-widget.css">
<script src="/vendor/lucide/lucide.min.js"></script>
<link rel="stylesheet" href="/css/schedule.css">
</head>
<body>
<header class="g-nav">
  <a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a>
  <div class="spacer"></div>
  <button class="icon-btn" id="addBtn" aria-label="일정 추가"><i data-lucide="plus"></i></button>
  <button class="icon-btn" id="pushBtn" aria-label="일정 알림 설정"><i data-lucide="bell"></i></button>
  <span class="ver" id="clock"></span>
</header>

<div class="g-main">
<div class="wrap">
  <div class="google-row" id="googleRow">
    <div class="google-info">
      <div class="google-title"><i data-lucide="link"></i>Google 연동 <span class="google-status" id="googleStatusLabel" data-state="unknown">확인 중…</span></div>
      <div class="google-desc" id="googleStatusDesc">Gmail·캘린더 연동 상태를 확인하고 있어요.</div>
    </div>
    <button class="m-btn solid" id="googleConnectBtn" type="button" style="display:none;">연결하기</button>
    <button class="m-btn ghost" id="googleDisconnectBtn" type="button" style="display:none;">연결 해제</button>
  </div>

  <!-- 일정 알림 안내 (운영 정본 문구 — 2026-11-11 앱 대조 카탈로그).
       전문은 카탈로그 기록이 '…'에서 끊겨 있어 회수된 부분까지만 넣었다.
       원본 schedule.html이 미회수라 정확한 위치·스타일 근거는 없다 —
       달력 위 최소 형태로 배치한다. -->
  <p class="push-notice" id="pushNotice">일정 알림은 이 기기에서 알림을 켠 경우에만 와요. 아이폰에서는 Safari의 공유 메뉴에서 ‘홈 화면에 추가’한 뒤, 그 아이콘으로 연 MyHub에서 알림 버튼을 켜야 해요.</p>

  <div class="cal-layout">
    <div class="cal-left">
      <div class="cal-nav">
        <button class="nav-btn" id="prevM" aria-label="이전 달"><i data-lucide="chevron-left"></i></button>
        <h2 id="calTitle"></h2>
        <button class="nav-btn" id="nextM" aria-label="다음 달"><i data-lucide="chevron-right"></i></button>
        <span class="spacer"></span>
        <div class="view-switch" role="group" aria-label="보기 전환">
          <button class="vs-btn" type="button" data-view="month">월</button>
          <button class="vs-btn" type="button" data-view="week">주</button>
          <button class="vs-btn" type="button" data-view="day">일</button>
        </div>
        <button class="nav-btn today-btn" id="todayBtn">오늘</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="week-grid" id="weekGrid" style="display:none;"></div>
      <div class="day-view" id="dayView" style="display:none;"></div>
    </div>
    <div class="day-sec">
      <h3 id="dayTitle"></h3>
      <div id="dayItems"></div>
    </div>
  </div>
</div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle">일정 추가</h3>
    <div id="modalNotice" class="modal-notice" hidden></div>
    <input type="hidden" id="fId">
    <div class="fld"><label>제목</label><input id="fTitle" type="text" maxlength="200" placeholder="일정 제목"></div>
    <div class="fld-row">
      <div class="fld"><label>시작</label><input id="fStart" type="datetime-local"></div>
      <div class="fld"><label>종료</label><input id="fEnd" type="datetime-local"></div>
    </div>
    <div class="fld"><label>장소</label><input id="fLocation" type="text" maxlength="200" placeholder="장소 (선택)"></div>
    <div class="fld"><label>설명</label><textarea id="fDesc" maxlength="2000" placeholder="설명 (선택)"></textarea></div>
    <div class="fld"><label>반복</label>
      <select id="fRrule">
        <option value="">안 함</option>
        <option value="FREQ=DAILY">매일</option>
        <option value="FREQ=WEEKLY">매주</option>
        <option value="FREQ=MONTHLY">매월</option>
      </select>
    </div>
    <div class="modal-acts">
      <button class="m-btn text-danger" id="delBtn" style="display:none;">삭제</button>
      <span class="grow"></span>
      <button class="m-btn ghost" id="cancelBtn">취소</button>
      <button class="m-btn solid" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script src="/js/google-connect.js"></script>
<script src="/assistant-widget.js"></script>
<!-- 비서 브리지: SCHEDULE_CSP(script-src 'self')라 인라인 init이 차단되므로,
     원본(canonical)의 인라인 init 값(scheduler/캘리)을 bridge data-*로 게시한다.
     단독 실행이면 위젯 init, 창 모드이면 셸에 assistant-declare를 보낸다. -->
<script src="/js/assistant-bridge.js" data-persona-id="scheduler" data-persona-name="캘리" data-avatar="/avatars/cali-128.webp"></script>
<script src="/js/schedule.js"></script>
</body>
</html>
