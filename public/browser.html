<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>브라우저</title>
<link rel="stylesheet" href="/shell.css">
<script src="/vendor/lucide/lucide.min.js"></script>
<link rel="stylesheet" href="/css/browser.css">
</head>
<body>
<header class="g-nav">
  <a href="/" class="brand-logo" aria-label="MyHub 홈"><img src="/icon-192.png" alt="JN" style="height:26px;width:auto;display:block;"></a>
  <span class="nav-title">브라우저</span>
  <div class="spacer"></div>
  <span class="ver" id="clock"></span>
</header>
<div class="g-main">
  <div class="bw-layout">
    <div class="bw-toolbar" id="bwToolbar">
      <button type="button" class="bw-icon-btn" id="bwSidebarBtn" aria-label="사이드바"><i data-lucide="panel-left"></i></button>
      <div class="bw-navgroup">
        <button type="button" class="bw-icon-btn" id="bwBackBtn" aria-label="뒤로"><i data-lucide="chevron-left"></i></button>
        <button type="button" class="bw-icon-btn" id="bwFwdBtn" aria-label="앞으로"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="bw-url-wrap">
        <input id="bwUrl" type="text" placeholder="검색 또는 웹사이트 이름 입력" autocomplete="off" spellcheck="false" aria-label="주소 또는 검색어">
        <button type="button" class="bw-icon-btn" id="bwReloadBtn" aria-label="새로고침"><i data-lucide="rotate-cw"></i></button>
      </div>
      <div class="bw-trailgroup">
        <button type="button" class="bw-icon-btn" id="bwShareBtn" aria-label="링크 복사"><i data-lucide="share"></i></button>
        <button type="button" class="bw-icon-btn bw-newtab" id="bwNewTabBtn" aria-label="새 탭"><i data-lucide="plus"></i></button>
        <button type="button" class="bw-icon-btn" id="bwOverviewBtn" aria-label="탭 개요"><i data-lucide="copy"></i></button>
      </div>
    </div>
    <div class="bw-tabstrip" id="bwTabstrip">
      <div class="bw-tabs" id="bwTabs" role="tablist"></div>
      <button type="button" class="bw-icon-btn bw-tabs-overflow" id="bwTabsOverflow" aria-label="모든 탭 보기" hidden><i data-lucide="chevron-down"></i></button>
      <div class="bw-tabs-menu" id="bwTabsMenu" hidden></div>
    </div>
    <div class="bw-stage">
      <div class="bw-home" id="bwHome">
        <div class="bw-start-card">
          <div class="bw-start-ic"><i data-lucide="monitor-up"></i></div>
          <div class="bw-start-text">
            <h1 class="bw-start-title">실제 브라우저</h1>
            <p class="bw-start-desc">원격 Chrome이라 로그인·영상까지 그대로 열려요. 시간 제한 없이 계속 쓸 수 있어요.</p>
          </div>
          <button type="button" class="bw-start-btn bw-start-big">브라우저 시작</button>
        </div>
        <div class="bw-section-head">
          <h2 class="bw-section-title">즐겨찾기</h2>
          <button type="button" class="bw-section-edit" id="bwFavsEdit">편집</button>
        </div>
        <div class="bw-favs" id="bwFavs"></div>
        <div class="bw-fav-form" id="bwFavForm" hidden>
          <input type="text" id="bwFavUrl" placeholder="주소 (예: https://example.com)" autocomplete="off" spellcheck="false" aria-label="북마크 주소">
          <input type="text" id="bwFavTitle" placeholder="이름 (비워두면 주소에서 가져와요)" autocomplete="off" spellcheck="false" aria-label="북마크 이름">
          <p class="bw-fav-form-msg" id="bwFavFormMsg" hidden></p>
          <div class="bw-fav-form-btns">
            <button type="button" class="bw-fav-form-save" id="bwFavSave">추가</button>
            <button type="button" class="bw-fav-form-cancel" id="bwFavCancel">취소</button>
          </div>
        </div>
        <div id="bwRecents" hidden>
          <h2 class="bw-section-title">최근 방문</h2>
          <div class="bw-recents" id="bwRecentsList"></div>
        </div>
      </div>
      <iframe class="bw-frame" id="bwLiveFrame" title="원격 브라우저" hidden sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
      <div class="bw-notice-card" id="bwNoticeCard" hidden>
        <p id="bwNoticeMsg"></p>
        <button type="button" id="bwNoticeClose">닫기</button>
      </div>
      <div class="bw-lock-card" id="bwLockCard" hidden>
        <div class="bw-lock-ic"><i data-lucide="lock"></i></div>
        <h2 class="bw-lock-title" id="bwLockTitle">브라우저가 잠겨 있어요</h2>
        <p class="bw-lock-desc" id="bwLockDesc">서버가 다시 시작돼 프로필 보관함이 잠겼어요. 암호를 입력하면 열립니다.</p>
        <div class="bw-lock-form" id="bwLockForm">
          <input type="password" id="bwLockPassword" placeholder="보관함 암호" autocomplete="current-password" minlength="8">
          <input type="password" id="bwLockConfirm" placeholder="암호 다시 입력" autocomplete="new-password" hidden>
          <p class="bw-lock-msg" id="bwLockMsg" hidden></p>
          <button type="button" class="bw-lock-btn" id="bwLockSubmit">풀기</button>
          <button type="button" class="bw-lock-close" id="bwLockClose">닫기</button>
        </div>
      </div>
      <div class="bw-sidebar-backdrop" id="bwSidebarBackdrop" hidden></div>
      <aside class="bw-sidebar" id="bwSidebar" hidden aria-label="사이드바">
        <div class="bw-sidebar-head">
          <h2 class="bw-sidebar-title">브라우저</h2>
          <button type="button" class="bw-icon-btn" id="bwSidebarClose" aria-label="사이드바 닫기"><i data-lucide="x"></i></button>
        </div>
        <div class="bw-sidebar-body">
          <section class="bw-sidebar-section">
            <h3 class="bw-sidebar-section-title">즐겨찾기</h3>
            <div class="bw-sidebar-list" id="bwSidebarFavs"></div>
          </section>
          <section class="bw-sidebar-section" id="bwSidebarHistorySection">
            <div class="bw-sidebar-section-head">
              <h3 class="bw-sidebar-section-title">방문 기록</h3>
              <button type="button" class="bw-sidebar-clear" id="bwHistoryClear">전체 삭제</button>
            </div>
            <input type="text" class="bw-sidebar-search" id="bwHistorySearch" placeholder="기록 검색" autocomplete="off" spellcheck="false" aria-label="방문 기록 검색">
            <div class="bw-sidebar-list" id="bwSidebarHistory"></div>
          </section>
          <section class="bw-sidebar-section">
            <h3 class="bw-sidebar-section-title">다운로드</h3>
            <div class="bw-sidebar-list" id="bwSidebarDownloads"></div>
          </section>
          <section class="bw-sidebar-section">
            <h3 class="bw-sidebar-section-title">열린 탭</h3>
            <div class="bw-sidebar-list" id="bwSidebarTabs"></div>
          </section>
        </div>
      </aside>
      <div class="bw-overview" id="bwOverview" hidden>
        <div class="bw-overview-head">
          <h2 class="bw-overview-title">열린 탭</h2>
          <input type="text" class="bw-overview-search" id="bwOverviewSearch" placeholder="탭 검색" autocomplete="off" spellcheck="false" aria-label="탭 검색">
          <button type="button" class="bw-icon-btn" id="bwOverviewClose" aria-label="탭 개요 닫기"><i data-lucide="x"></i></button>
        </div>
        <div class="bw-overview-grid" id="bwOverviewGrid"></div>
      </div>
    </div>
  </div>
</div>
<script src="/js/google-connect.js"></script>
<script src="/nav.js"></script>
<script src="/js/browser-live.js"></script>
<script src="/js/browser.js"></script>
</body>
</html>
