# garak 실행 설정 템플릿 (garak 0.17.1).
# run-garak.sh가 __PLACEHOLDER__를 치환해 임시 설정 파일을 만들어 실행한다.
# 직접 실행하려면 플레이스홀더를 실제 값으로 바꾸고 `garak --config <파일>`을 쓴다.
# (CLI의 --model_type/--model_name/--probes는 0.13/0.15부터 deprecated라 설정 파일 방식을 쓴다.)
---
system:
  verbose: 0
  narrow_output: false
  parallel_requests: false
  parallel_attempts: false
  lite: true

run:
  seed: 1
  deprefix: true
  eval_threshold: 0.5
  generations: 1

plugins:
  target_type: __TARGET_TYPE__
  target_name: __TARGET_NAME__
  probe_spec: __PROBE_SPEC__
  detector_spec: auto
  extended_detectors: true

reporting:
  report_prefix: __REPORT_PREFIX__
  taxonomy:
  confidence_interval_method: bootstrap
  bootstrap_num_iterations: 10000
  bootstrap_confidence_level: 0.95
  bootstrap_min_sample_size: 30
  hit_at_k: [1]
