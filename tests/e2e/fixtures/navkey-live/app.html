<!doctype html>
<html>
<head><meta charset="utf-8"><title>navkey-live app (browser-live stand-in)</title>
<style>html,body{margin:0;height:100%}#bwStage{width:100%;height:100%}#bwLiveFrame{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<div class="bw-stage" id="bwStage">
  <div class="bw-home" id="bwHome"></div>
  <iframe class="bw-frame" id="bwLiveFrame" title="원격 브라우저"></iframe>
  <div class="bw-notice-card" id="bwNoticeCard" hidden>
    <p id="bwNoticeMsg"></p><button type="button" id="bwNoticeClose">닫기</button>
  </div>
  <div class="bw-lock-card" id="bwLockCard" hidden>
    <h2 class="bw-lock-title" id="bwLockTitle">브라우저가 잠겨 있어요</h2>
    <p class="bw-lock-desc" id="bwLockDesc"></p>
    <div class="bw-lock-form" id="bwLockForm">
      <input type="password" id="bwLockPassword" placeholder="보관함 암호">
      <input type="password" id="bwLockConfirm" placeholder="암호 다시 입력" hidden>
      <p class="bw-lock-msg" id="bwLockMsg" hidden></p>
      <button type="button" class="bw-lock-btn" id="bwLockSubmit">풀기</button>
      <button type="button" class="bw-lock-close" id="bwLockClose">닫기</button>
    </div>
  </div>
</div>
<script src="/js/browser-live.js"></script>
<script>
// 실제 browser-live.js로 createLive를 만들고, enterLive 없이 라이브
// 프레임에 Selkies 대역 페이지를 직접 건다. 중계는 iframe load에
// 걸리므로 enterLive의 navigate·폴링은 이 검증에 필요 없다.
// (nav.js는 일부러 안 건다 — 이 경로는 browser-live.js가 셸에 직접
// postMessage하므로 nav.js 중계와 무관하다.)
var live = window.MyHubBrowserLive.createLive({
  doc: document,
  navigate: function () { return Promise.resolve({ status: 200, body: { ok: true, nav: 'ok', navStage: 'ok' } }); },
  checkUnlock: function () { return Promise.resolve({ status: 200, body: { configured: true, unlocked: true } }); },
  submitUnlock: function () { return Promise.resolve({ status: 200, body: { ok: true } }); },
  setQuality: function () { return Promise.resolve({ status: 200, body: { ok: true, mode: 'auto', connections: 1 } }); },
  pollDelayMs: 10000,
  onChange: function () { live.syncChrome(); },
});
window.__live = live;
document.getElementById('bwLiveFrame').src = '/navkey-live/view.html';
</script>
</body>
</html>
